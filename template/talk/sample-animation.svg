<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1280 390" width="1280" height="390" role="img" aria-label="[[describe the drawing]]">
<title>[[describe the drawing]]</title>
<style>
text{font-family:"Geist","Inter","Segoe UI",Arial,sans-serif;fill:#1f2328}
.t{font-size:22px;font-weight:700} .s{font-size:16px;fill:#6b7280} .h{font-size:34px;font-weight:800}
.b{font-size:18px;font-weight:600} .c{text-anchor:middle} .w{fill:#fff}
.n{animation:pop .55s ease backwards;animation-delay:var(--d,0s)}
.d{stroke-dasharray:1;animation:draw .7s ease backwards;animation-delay:var(--d,0s)}
.f{animation:flow 1.1s linear infinite;stroke-dasharray:10 8}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes draw{0%{stroke-dashoffset:1;marker-end:none}99%{stroke-dashoffset:.01;marker-end:none}100%{stroke-dashoffset:0;marker-end:url(#ar)}}
@keyframes drawb{0%{stroke-dashoffset:1;marker-end:none}99%{stroke-dashoffset:.01;marker-end:none}100%{stroke-dashoffset:0;marker-end:url(#arb)}}
.d.hb{animation-name:drawb}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes dim{to{opacity:.2}}
.dm{animation:pop .55s ease backwards var(--d,0s),dim .6s ease forwards var(--d2,5s)}
@keyframes mv{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
.mvin{animation:pop .4s ease backwards var(--d,0s),mv 1.1s ease forwards calc(var(--d,0s) + .5s)}
.mvout{animation:mv 1.1s ease forwards calc(var(--d,0s) + .5s)}
.mvout.go{animation:mv 1.1s ease forwards calc(var(--d,0s) + .5s),fadeout .5s ease forwards calc(var(--d,0s) + 1.7s)}
.bad{animation:badc .4s ease forwards 6.4s}
@keyframes badc{to{fill:#fbe6e3;stroke:#c0392b}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rej{0%{opacity:0}6%{opacity:1}88%{opacity:1}100%{opacity:0}}
.rej{animation:rej 4.4s ease both;animation-delay:var(--d,0s)}
@keyframes fadeout{to{opacity:0}}
.fade{animation:fadeout .7s ease forwards;animation-delay:var(--o,0s)}
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s ease backwards;animation-delay:var(--d,0s)}
</style>
<text x="60" y="64" class="h n" style="--d:0.1s">[[Drawing title]]</text><text x="60" y="96" class="s n" style="--d:0.2s">[[One line that says what the drawing shows.]]</text><g class="n" style="--d:0.6s"><rect x="60" y="150" width="300" height="90" rx="14" fill="#e8eefb" stroke="#2457c5" stroke-width="2.2"/><text x="210.0" y="186" class="b c">[[Step 1]]</text><text x="210.0" y="212" class="s c">[[what it does]]</text></g><path d="M366 195 L474 195" pathLength="1" class="d hb" style="--d:1.2s" fill="none" stroke="#2457c5" stroke-width="2.6" marker-end="url(#arb)"/><g class="n" style="--d:1.6s"><rect x="480" y="150" width="300" height="90" rx="14" fill="#e1f3f3" stroke="#0f8b8d" stroke-width="2.2"/><text x="630.0" y="186" class="b c">[[Step 2]]</text><text x="630.0" y="212" class="s c">[[what it does]]</text></g><path d="M786 195 L894 195" pathLength="1" class="d hb" style="--d:2.2s" fill="none" stroke="#2457c5" stroke-width="2.6" marker-end="url(#arb)"/><g class="n" style="--d:2.6s"><rect x="900" y="150" width="300" height="90" rx="14" fill="#e3f4ea" stroke="#1f8a4c" stroke-width="2.2"/><text x="1050.0" y="186" class="b c">[[Step 3]]</text><text x="1050.0" y="212" class="s c">[[what it does]]</text></g><rect x="80" y="262" width="260" height="8" rx="4" fill="#c9ced6" class="n" style="--d:3.0s"/><rect x="80" y="262" width="260" height="8" rx="4" fill="#0f8b8d" class="g" style="--d:3.3s"/><path d="M1050 246 C1050 330 630 330 630 246" pathLength="1" class="d" style="--d:4.0s" fill="none" stroke="#c77d0a" stroke-width="2.6" marker-end="url(#ar)"/><text x="840" y="352" class="s c n" style="--d:4.6s;fill:#c77d0a">[[feedback: the result goes back into the loop]]</text><g class="n" style="--d:5.2s"><circle cx="1050" cy="300" r="13" fill="#1f8a4c"/><path d="M1044 300 l4 5 l9 -10" stroke="#fff" stroke-width="3" fill="none"/></g><text x="60" y="396" class="s n" style="--d:5.6s">[[Source or one-line takeaway.]]</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2457c5"/></marker></defs></svg>
